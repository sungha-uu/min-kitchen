<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>급식 레시피 노트</title>
  <script>
    try { const t = localStorage.getItem("srn-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=20261101-4">
</head>
<body>
  <!-- 잠금 화면 -->
  <section class="lock" id="lock" hidden>
    <form class="lock-card" id="lockForm" autocomplete="off">
      <span class="lock-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M5 15h22a11 11 0 0 1-22 0Z" fill="currentColor"/><path d="M11 10c0-2 2-2 2-4M16 10c0-2 2-2 2-4M21 10c0-2 2-2 2-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </span>
      <h1>급식 레시피 노트</h1>
      <p>비밀번호를 입력하면 레시피를 볼 수 있어요.</p>
      <label class="pin">
        <span class="sr-only">비밀번호</span>
        <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" required>
      </label>
      <label class="remember"><input id="rememberInput" type="checkbox" checked> 이 기기에서 기억하기</label>
      <button class="btn-primary" id="unlockButton" type="submit">열기</button>
      <p class="lock-error" id="lockError" role="alert"></p>
    </form>
  </section>

  <div class="app" id="app" hidden>
    <aside class="sidebar" aria-label="레시피 목록">
      <header class="side-head">
        <a class="brand" href="#" data-home>
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M5 15h22a11 11 0 0 1-22 0Z" fill="currentColor"/><path d="M11 10c0-2 2-2 2-4M16 10c0-2 2-2 2-4M21 10c0-2 2-2 2-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="brand-name">급식 레시피 노트</span>
        </a>
        <div class="side-tools">
          <button class="icon-btn" id="themeButton" type="button" aria-label="화면 테마 바꾸기" title="테마"></button>
          <button class="icon-btn" id="lockButton" type="button" aria-label="잠그기" title="잠그기">
            <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
          </button>
        </div>
      </header>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="searchInput" type="search" placeholder="메뉴나 재료 검색" autocomplete="off" enterkeyhint="search">
        <kbd>/</kbd>
      </label>

      <nav class="categories" id="categoryList" aria-label="분류"></nav>

      <div class="list-head"><span id="filterTitle">전체</span><span id="visibleCount"></span></div>
      <ul class="recipe-list" id="recipeList"></ul>
      <div class="empty" id="emptyState" hidden>
        <b>찾는 레시피가 없어요</b>
        <p>다른 검색어나 분류를 골라 보세요.</p>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <article class="detail" id="recipeDetail" aria-live="polite"></article>
    </main>
  </div>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer-bar">
      <span id="viewerTitle"></span>
      <div>
        <button class="viewer-btn" id="viewerZoom" type="button">원래 크기</button>
        <button class="viewer-btn" id="viewerClose" type="button" aria-label="닫기">닫기</button>
      </div>
    </div>
    <div class="viewer-stage" id="viewerStage"><img id="viewerImage" alt=""></div>
  </div>

  <script src="app.js?v=20261101-4"></script>
</body>
</html>
